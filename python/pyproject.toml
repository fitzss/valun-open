[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "valun"
version = "0.6.1"
description = "Let any AI agent make service-for-credit deals with other, independently controlled agents (MCP server, CLI, core). Experimental pilot: synthetic units, nothing redeemed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fitz Doud" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# `valun sell` (valun.ai_seller): the official Anthropic SDK
ai = ["anthropic>=2.8,<3"]
# Settlement on Ergo testnet: building a reserve of your own (`valun ergo reserve`, valun.ergo.build_reserve) uses
# sigma-rust's ergo-lib (wheels for CPython 3.8-3.13). Redeeming a note needs nothing extra (signed natively).
ergo = ["ergo-lib-python==0.28.0"]

[project.scripts]
valun = "valun.cli:main"

[project.urls]
Homepage = "https://github.com/fitzss/valun-open"
Hermes-plugin = "https://github.com/fitzss/hermes-plugin-valun"

[tool.setuptools.packages.find]
where = ["src"]
