name: release
# Publishes a tagged release (vX.Y.Z) with trusted publishing, so no package-registry token exists anywhere:
#   pypi  builds the `valun` Python package, checks it installs and runs, and uploads it through PyPI's trusted
#         publisher for this repository and workflow (environment "pypi").
#   npm   publishes the `@fitzdoud/valun` JavaScript package with provenance through npm's trusted publisher (environment "npm"),
#         and skips a version that is already on npm (the first npm release is published by hand).
#   mcp-registry  lists the PyPI package in the official MCP Registry as io.github.fitzss/valun (server.json), once PyPI
#         serves the release. Ownership: the PyPI description (python/README.md) carries "mcp-name: io.github.fitzss/valun";
#         login is this workflow's GitHub OIDC identity, so no registry token exists anywhere either.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/valun
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match python/pyproject.toml version $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install "build==1.6.1"
          python -m build --outdir dist python
      - name: The built wheel installs and runs
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/valun --version
          /tmp/try/bin/valun tools > /dev/null
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Test, then publish unless this version is already on npm
        working-directory: js
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match js/package.json version $v"; exit 1; }
          node --test test/
          name=$(node -p "require('./package.json').name")
          if ! npm view "$name" version > /dev/null 2>&1; then
            echo "$name is not on npm yet: the first npm release is published by hand (npm cannot trust-publish a new name)"; exit 0; fi
          if npm view "$name@$v" version > /dev/null 2>&1; then echo "$name@$v is already on npm: nothing to publish"; exit 0; fi
          npm publish --provenance --access public

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628   # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: server.json matches the tag
        run: |
          v=$(jq -r .version server.json); p=$(jq -r '.packages[0].version' server.json)
          test "v$v" = "$GITHUB_REF_NAME" && test "$p" = "$v" || { echo "server.json versions ($v, $p) do not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher (pinned; checksum and Sigstore signature checked)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          identity="https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait until PyPI serves this version with the ownership marker
        run: |
          v=$(jq -r .version server.json); marker="mcp-name: $(jq -r .name server.json)"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/valun/$v/json" | jq -e --arg m "$marker" '.info.description | contains($m)' > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "PyPI does not show valun $v with '$marker' in its description"; exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
