name: release
# Publishes a tagged release (vX.Y.Z) with trusted publishing, so no package-registry token exists anywhere:
#   verify  (no id-token) the gate every publishing job needs: the tag matches every version; the Python unit tests;
#         the protocol vectors against the package and against the Hermes plugin 0.6.2 at PLUGIN_SHA, with the
#         circulation and consent tiers required; the plugin's vendored core equals the package's (check_plugin_core);
#         the JavaScript tests; then it builds the Python distributions and uploads them as an artifact. Build tooling
#         runs here, where no OIDC token can be minted (audit SC-1).
#   pypi  downloads that artifact and uploads it through PyPI's trusted publisher for this repository and workflow
#         (environment "pypi"); nothing is built or installed in the job that holds id-token: write.
#   npm   publishes the `@fitzdoud/valun` JavaScript package with provenance through npm's trusted publisher (environment "npm"),
#         and skips a version that is already on npm (the first npm release is published by hand).
#   mcp-registry  lists the PyPI package in the official MCP Registry as io.github.fitzss/valun (server.json), once PyPI
#         serves the release. Ownership: the PyPI description (python/README.md) carries "mcp-name: io.github.fitzss/valun";
#         login is this workflow's GitHub OIDC identity, so no registry token exists anywhere either.
# Tag only a commit whose ci workflow is green, and only after PLUGIN_SHA below (and the plugin pin in ci.yml, which
# verify compares with it) is the plugin commit actually pushed to fitzss/hermes-plugin-valun: PyPI and npm versions
# are immutable. Requiring green CI on tags (a ruleset) and reviewers on the pypi and npm environments are owner steps.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  # Hermes plugin 0.6.2: the commit the conformance checks run against. Must equal the plugin pin in ci.yml.
  PLUGIN_SHA: ac6e4b357fefc943935e07c66c7b1f7c0e6d3850
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: fitzss/hermes-plugin-valun
          ref: ${{ env.PLUGIN_SHA }}
          path: hermes-plugin-valun
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The tag matches every version, and the plugin pin is the one ci.yml checks
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          j=$(node -p "require('./js/package.json').version")
          s=$(jq -r .version server.json); p=$(jq -r '.packages[0].version' server.json)
          for x in "$v" "$j" "$s" "$p"; do
            test "v$x" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match a version ($v, $j, $s, $p)"; exit 1; }
          done
          grep -q "ref: $PLUGIN_SHA" .github/workflows/ci.yml || { echo "PLUGIN_SHA is not the plugin pin of ci.yml"; exit 1; }
      - name: The shipped docs no longer call this version unreleased (npm and PyPI keep them for good)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if grep -nEi "unreleased|not published|not released" js/README.md python/README.md; then
            echo "js/README.md or python/README.md still says a version is unreleased: make the release-docs commit first"; exit 1; fi
          if grep -F "## $v " CHANGELOG.md | grep -qi unreleased; then echo "CHANGELOG.md still marks $v unreleased"; exit 1; fi
      - name: Unit and MCP protocol tests (standard library only)
        run: |
          python -m pip install ./python
          python -m unittest discover -s python/tests
      - name: Vectors vs the valun package, circulation and consent tiers required
        run: python spec/vectors/check_python.py --client package --require circulation/1
      - name: Vectors vs the Hermes plugin 0.6.2, circulation and consent tiers required
        run: python spec/vectors/check_python.py --client plugin --plugin-dir hermes-plugin-valun --require circulation/1
      - name: The plugin 0.6.2 carries the valun package's core unchanged
        run: python scripts/check_plugin_core.py hermes-plugin-valun
      - name: JavaScript tests (every vector, transcript replay)
        run: node --test js/test/
      - name: Build
        run: |
          python -m pip install "build==1.6.1"
          python -m build --outdir dist python
      - name: The built wheel installs and runs
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/valun --version
          /tmp/try/bin/valun tools > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/valun
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish unless this version is already on npm (verify ran the tests)
        working-directory: js
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match js/package.json version $v"; exit 1; }
          name=$(node -p "require('./package.json').name")
          if ! npm view "$name" version > /dev/null 2>&1; then
            echo "$name is not on npm yet: the first npm release is published by hand (npm cannot trust-publish a new name)"; exit 0; fi
          if npm view "$name@$v" version > /dev/null 2>&1; then echo "$name@$v is already on npm: nothing to publish"; exit 0; fi
          npm publish --provenance --access public

  mcp-registry:
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628   # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: server.json matches the tag
        run: |
          v=$(jq -r .version server.json); p=$(jq -r '.packages[0].version' server.json)
          test "v$v" = "$GITHUB_REF_NAME" && test "$p" = "$v" || { echo "server.json versions ($v, $p) do not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher (pinned; checksum and Sigstore signature checked)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          identity="https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait until PyPI serves this version with the ownership marker
        run: |
          v=$(jq -r .version server.json); marker="mcp-name: $(jq -r .name server.json)"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/valun/$v/json" | jq -e --arg m "$marker" '.info.description | contains($m)' > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "PyPI does not show valun $v with '$marker' in its description"; exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
