name: ci
# Proves Valun's clients on Linux, macOS and Windows, with no network access to the Valun server and no secrets:
#   python       the `valun` package: unit tests, MCP protocol tests over real stdio pipes, official MCP SDK interop, CLI
#   conformance  the protocol vectors (generated from the server's own code) against the package AND the published
#                Hermes plugin at the commit the Hermes catalog pins
#   js           the zero-dependency JavaScript/TypeScript client: every vector, transcript replay, type check
#   registry     server.json (the MCP Registry entry) passes the registry's own validator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install ./python
      - name: Unit and MCP protocol tests (standard library only)
        run: python -m unittest discover -s python/tests -v
      - name: Official MCP SDK interoperability
        run: |
          python -m pip install "mcp==2.3.0"
          python -m unittest python/tests/test_sdk_interop.py -v
      - name: CLI smoke test
        shell: bash
        run: |
          export VALUN_HOME="$RUNNER_TEMP/valun-home"
          valun --version
          valun tools > /dev/null
          valun status
          valun doctor --server http://127.0.0.1:9 || true

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: fitzss/hermes-plugin-valun
          ref: 5d01fbdde03ab5ad80f51b6547026fb06cd5e20e     # the commit the Hermes plugin catalog pins (0.3.0)
          path: hermes-plugin-valun
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Vectors vs the valun package
        run: python spec/vectors/check_python.py --client package
      - name: Vectors vs the published Hermes plugin
        run: python spec/vectors/check_python.py --client plugin --plugin-dir hermes-plugin-valun
      - name: The plugin carries the valun package's core unchanged
        run: python scripts/check_plugin_core.py hermes-plugin-valun

  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (every vector, transcript replay, no dependencies)
        run: node --test js/test/
      - name: Type definitions compile (TypeScript 6.0.3, strict)
        if: matrix.node == '24'
        run: npx -y -p typescript@6.0.3 tsc --noEmit --strict --lib es2022,dom js/src/index.d.ts js/src/file-store.d.ts

  registry:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628   # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher (pinned; checksum and Sigstore signature checked)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          identity="https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: server.json passes the registry's validator
        run: ./mcp-publisher validate
