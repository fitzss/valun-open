name: ci
# Proves Valun's clients on Linux, macOS and Windows, with no network access to the Valun server and no secrets:
#   test         the `valun` package: unit tests (the 0.4 circulation tests included), MCP protocol tests over real
#                stdio pipes, official MCP SDK interop, CLI
#   conformance  the protocol vectors (generated from the server's own code, release v16) against the package and the
#                Hermes plugin 0.4.0, both also held to the circulation and consent tiers (--require circulation/1),
#                and against the plugin 0.3.0 the Hermes catalog pins until its entry moves to 0.4.0
#   fixtures     CPython 3.14 regenerates the JS client's Python fixtures; they must equal the committed ones
#   js           the zero-dependency JavaScript/TypeScript client: every vector, transcript replay, type check
#   registry     server.json (the MCP Registry entry) passes the registry's own validator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install ./python
      - name: Unit and MCP protocol tests (standard library only)
        run: python -m unittest discover -s python/tests -v
      - name: Official MCP SDK interoperability
        run: |
          python -m pip install "mcp==2.3.0"
          python -m unittest python/tests/test_sdk_interop.py -v
      - name: CLI smoke test
        shell: bash
        run: |
          export VALUN_HOME="$RUNNER_TEMP/valun-home"
          valun --version
          valun tools > /dev/null
          valun status
          valun doctor --server http://127.0.0.1:9 || true

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      # Hermes plugin 0.4.0. NEEDS THE PUSHED SHA: 2b78a06 is the last LOCAL code commit of the plugin's v0.4.0 branch
      # (only changelog commits follow it there) and is not on GitHub yet. Before this workflow is pushed, replace
      # it with the commit actually pushed to fitzss/hermes-plugin-valun (the one the catalog update pins), or this
      # checkout fails.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: fitzss/hermes-plugin-valun
          ref: 2b78a0624f6f28ff31f0f32c1b11312ab726f33d     # plugin 0.4.0 (local commit: replace with the pushed SHA)
          path: hermes-plugin-valun
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: fitzss/hermes-plugin-valun
          ref: 5d01fbdde03ab5ad80f51b6547026fb06cd5e20e     # plugin 0.3.0, the commit the Hermes plugin catalog pins today
          path: hermes-plugin-valun-0.3.0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Vectors vs the valun package
        run: python spec/vectors/check_python.py --client package
      - name: Vectors vs the valun package, circulation and consent tiers required
        run: python spec/vectors/check_python.py --client package --require circulation/1
      - name: Vectors vs the Hermes plugin 0.4.0, circulation and consent tiers required
        run: python spec/vectors/check_python.py --client plugin --plugin-dir hermes-plugin-valun --require circulation/1
      - name: Vectors vs the Hermes plugin 0.3.0 (the catalog pin, until the catalog entry moves to 0.4.0)
        run: python spec/vectors/check_python.py --client plugin --plugin-dir hermes-plugin-valun-0.3.0
      - name: The plugin 0.4.0 carries the valun package's core unchanged
        run: python scripts/check_plugin_core.py hermes-plugin-valun

  fixtures:
    # The JS tests compare the JavaScript client with fixtures recorded from the Python reference by CPython 3.14 (its
    # error texts and a few results differ from 3.12's). Regenerating them must reproduce the committed files exactly;
    # only the recorded patch version ("python": "3.14.x") may differ.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Regenerate the JS client's Python fixtures (offline, deterministic)
        run: python js/test/fixtures/generate_python_fixtures.py
      - name: The regenerated fixtures equal the committed ones
        run: |
          git diff --exit-code -I '"python": "3\.14\.[0-9]*",$' -- js/test/fixtures

  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (every vector, transcript replay, no dependencies)
        run: node --test js/test/
      - name: Type definitions compile (TypeScript 6.0.3, strict)
        if: matrix.node == '24'
        run: npx -y -p typescript@6.0.3 tsc --noEmit --strict --lib es2022,dom js/src/index.d.ts js/src/file-store.d.ts js/src/dns.d.ts

  registry:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628   # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher (pinned; checksum and Sigstore signature checked)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          identity="https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: server.json passes the registry's validator
        run: ./mcp-publisher validate
