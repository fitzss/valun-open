name: ci
# Proves the package on Linux, macOS and Windows: unit tests, MCP protocol tests over real stdio pipes, and
# interoperability with the official MCP Python SDK client. No network access to the Valun server, no secrets.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install ./python
      - name: Unit and MCP protocol tests (standard library only)
        run: python -m unittest discover -s python/tests -v
      - name: Official MCP SDK interoperability
        run: |
          python -m pip install "mcp==2.3.0"
          python -m unittest python/tests/test_sdk_interop.py -v
      - name: CLI smoke test
        shell: bash
        run: |
          export VALUN_HOME="$RUNNER_TEMP/valun-home"
          valun --version
          valun tools > /dev/null
          valun status
          valun doctor --server http://127.0.0.1:9 || true
