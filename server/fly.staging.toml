# STAGING for the Valun testnet network, on Fly.io (Fly app valun-staging, https://valun-staging.fly.dev): the same image as
# valun-testnet, deployed first. CI deploys every push to main here; the public testnet changes only when promoted
# (a manual workflow, after staging is green). Owner-approved 2026-11-13: a spending cap of $5 a month.
# It runs its OWN tracker on Ergo testnet: its own key on this volume, its own tracker NFT, funded with 1 tERG from the
# testnet tracker, and its own daily cap of 50 tracker boxes. Its participants, notes and loops are its own: a profile
# made for the public testnet does not work here (the client refuses another tracker), and the reverse.
# One shared-cpu-1x / 512 MB machine that sleeps when idle (so it does not anchor while asleep), and one 1 GB volume.
# Test data only; staging may be reset.
app = "valun-staging"
primary_region = "iad"
swap_size_mb = 256

[build]

[env]
  VALUN_DEPLOYMENT = "hosted"
  NODE_OPTIONS = "--max-old-space-size=160"
  VALUN_TRUST_FLY_CLIENT_IP = "1"
  PILOT_NETWORK = "valun-testnet-1"
  # Staging's own links (loop cards, agent pages, the A2A card) name staging, not valun.tech.
  VALUN_PUBLIC_ORIGIN = "https://valun-staging.fly.dev"
  # Staging says it is staging (lib/environment.mjs, fix inbox #41): GET /pilot/v1/info names `environment: "staging"`
  # and every page opens with a one-line banner that links to the network (https://valun.tech). The testnet sets none.
  VALUN_ENVIRONMENT = "staging"
  PILOT_OPEN_SANDBOX = "1"
  PILOT_OPEN_NETWORK = "1"
  # Circulating credit (debt transfers, set-offs) with anchored netting: it takes effect only once the tracker is on
  # chain with tracker v4 TR-15's anchored-netting capability and its binary is pinned (lib/pilot/caps.mjs, pins.mjs);
  # otherwise the server runs as off and says why (GET /info).
  PILOT_CIRCULATION = "on"
  ERGO_NODE_URL = "http://213.239.193.208:9052"
  # The tracker box updater's cycle: it anchors a changed state at most once a cycle and confirms an anchor on the next
  # one, so a note is redeemable (and a netting final) about 2 cycles after it lands. Spending stays bounded: an update
  # happens only when the state changed (or the keep-alive is due), and the wallet adapter signs at most 50 tracker-box
  # updates a UTC day (0.001 tERG each).
  BASIS_TRACKER_UPDATE_INTERVAL_SECONDS = "300"
  # basis.es (the Basis ERG reserve contract, 764 bytes, sha256 760b84d2...), testnet-encoded.
  BASIS_RESERVE_CONTRACT_TESTNET = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/status"

[[mounts]]
  source = "valun_staging_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
